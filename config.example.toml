# Copy to config.toml in the checkout (gitignored). Everything identifying the owner lives only there.
[book]
title = "Your Book Title"

[sender]
name = "Your Name"
address = "you@mail.example.com"      # a sending subdomain you control (SPF, DKIM, DMARC set)
reply_to = "you+book@gmail.example"   # plus-address read by the inbox area
postal_address = "Street, City, State ZIP"   # CAN-SPAM footer

[caps]
max_recipients_per_send = 50
max_sends_per_day = 100
max_image_kilobytes_per_campaign = 100   # all inline images together

[classifier]
model = "jev-latest"
unsubscribe_min_probability = 0.80
confirm_min_probability = 0.95
