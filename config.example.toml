# Behaviour only (copy to config.toml, optional). The book title, sender and footer address are
# set in the web app and stored in the database.
[caps]
max_recipients_per_send = 50
max_sends_per_day = 100
max_image_kilobytes_per_campaign = 100   # all inline images together

[classifier]
model = "jev-latest"
unsubscribe_min_probability = 0.80
confirm_min_probability = 0.95
